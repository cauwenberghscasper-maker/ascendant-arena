name: checks
# Every push to main or a work branch and every pull request: index.html up to date with src/, the node checks, and
# the smoke test (the real game in headless Chromium). A red check is fixed before merging (docs/TEAMWORK.md).
on:
  push:
    branches: [main, 'claude/**', 'wip/**', 'codex/**', 'feat/**', 'fix/**']
    paths-ignore: ['docs/**', '**.md']
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { lfs: false }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: index.html is built from src/
        run: node tools/build.cjs --check
      - name: node checks
        run: |
          npm run check
          git checkout -- audit/regression-evidence.json 2>/dev/null || true
      - name: install Chromium
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: smoke test (boot, play, attacks, bodies stay on their spot)
        env: { SMOKE_SHOTS: smoke-shots, CI: '1' }
        run: node tools/check_smoke.cjs
      - name: screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: smoke-shots, path: smoke-shots, if-no-files-found: ignore, retention-days: 7 }
