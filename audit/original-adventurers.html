<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ascendant Arena · Adventurers</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#102126;color:#edf4e8;font:16px/1.5 system-ui}main{max-width:1150px;margin:auto;padding:28px}h1{margin:0;font-size:32px}p{color:#a8c0bb}a{color:#e6c67e}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}button,select{font:inherit;color:inherit;background:#264442;border:1px solid #52746c;border-radius:12px;padding:10px 16px;min-height:44px;cursor:pointer}button[aria-pressed=true]{background:#e0c27b;color:#182b2b}.stage{height:570px;border-radius:22px;background:radial-gradient(ellipse at 50% 45%,#496c5e,#152c30 72%);overflow:hidden}.stage canvas{display:block;width:100%;height:100%}.note{font-size:13px}.error{color:#ffb0a0}@media(max-width:600px){main{padding:16px}.stage{height:470px}h1{font-size:26px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"}}</script>
<main><p>ASCENDANT ARENA / CHARACTER REVIEW</p><h1>Original adventurers</h1><p>The original heroes, dressed for the fantasy world and animated with adapted KayKit clips.</p>
<div class="controls"><select id="hero" aria-label="Character"><option value="bolt">Pip</option><option value="wave">Brick</option><option value="arrow">Ayla</option><option value="orb">Lumi</option><option value="scatter">Bruno</option></select><button data-mode="idle">Idle</button><button data-mode="run">Run</button><button data-mode="attack">Attack</button><button data-mode="runAttack">Run + attack</button><button data-mode="dash">Dodge</button><button data-mode="death">Defeat</button></div>
<div class="stage" id="stage"></div><p id="status" class="note">Loading character…</p><p class="note">Source animations by <a href="https://kaylousberg.itch.io/kaykit-adventurers">Kay Lousberg</a> · CC0. <a href="../">Play the game</a></p></main>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {prepareOriginalAdventurer} from '../assets/art/original-adventurers.js';
const ORIGINALS=await fetch('original-heroes.json').then(r=>r.json());
const picker=document.getElementById('hero');picker.innerHTML=Object.entries(ORIGINALS).map(([id,d])=>`<option value="${id.slice(5)}">${d.dir.split('/').filter(Boolean).at(-1)}</option>`).join('');
const CLIPS=(await fetch('../assets/animation/original-hero-clips.json').then(r=>r.json())).map(c=>THREE.AnimationClip.parse(c));
import {createKayKitMotion} from '../assets/data/kaykit-motion.js';
const stage=document.getElementById('stage'),renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.NeutralToneMapping;stage.append(renderer.domElement);
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(32,1,.01,40);camera.position.set(2.7,2.3,4.5);
scene.add(new THREE.HemisphereLight(0xe4f1ff,0x43543c,2));const light=new THREE.DirectionalLight(0xffeed1,3);light.position.set(-3,5,4);scene.add(light);const rim=new THREE.DirectionalLight(0x92b9d5,1.8);rim.position.set(3,2,-4);scene.add(rim);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,1,0);controls.enableDamping=true;controls.update();
const floor=new THREE.Mesh(new THREE.CylinderGeometry(.85,.95,.10,64),new THREE.MeshStandardMaterial({color:0x375b4b,roughness:1}));floor.position.y=-.06;scene.add(floor);
let model,motion,clips,mode='idle',time=0,lastHit=-1,loading=0;
const entity={x:0,z:0,moveAmt:0,alive:true,lastAttack:-99,lastHurt:-99,attackAnim:0,dashT:0};
async function choose(id){document.getElementById('hero').value=id;const seq=++loading;const def={...ORIGINALS['hero.'+id],character:id,attack:['wave','scatter','gatling'].includes(id)?'1H_Melee_Attack_Slice_Horizontal':['orb','seeker','flamer','starfall','chain'].includes(id)?'Spellcast_Shoot':'1H_Ranged_Shoot'};const pack=await fetch('../'+def.dir+'model.json').then(r=>r.json());const bytes=Uint8Array.from(atob(pack.glb),c=>c.charCodeAt(0));const gltf=await new GLTFLoader().parseAsync(bytes.buffer,'../'+def.dir);if(seq!==loading)return;if(motion)motion.dispose();if(model)scene.remove(model);model=gltf.scene;prepareOriginalAdventurer(model,def,THREE);clips=CLIPS;window.review.def=def;scene.add(model);motion=createKayKitMotion(THREE,model,clips,def);entity.lastAttack=-99;entity.lastHurt=-99;entity.alive=true;lastHit=-1;let tris=0;model.traverse(o=>{if(o.isMesh&&o.visible)tris+=(o.geometry.index?.count||o.geometry.attributes.position.count)/3;});document.getElementById('status').textContent=id+' · Original mesh'+' · '+Math.round(tris).toLocaleString()+' visible triangles · '+clips.length+' authored clips';window.review.model=model;window.review.clips=clips;window.review.motion=motion;window.review.ready=true;}
function setMode(value){mode=value;lastHit=-1;entity.lastAttack=-99;for(const b of document.querySelectorAll('[data-mode]'))b.setAttribute('aria-pressed',String(b.dataset.mode===mode));}
document.getElementById('hero').onchange=e=>{window.review.ready=false;choose(e.target.value).catch(fail)};document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
function fail(e){document.getElementById('status').textContent=e.message;document.getElementById('status').className='error';console.error(e)}
new ResizeObserver(()=>{renderer.setSize(stage.clientWidth,stage.clientHeight);camera.aspect=stage.clientWidth/stage.clientHeight;camera.updateProjectionMatrix()}).observe(stage);
window.review={THREE,choose,setMode,entity,ready:false,renderer,scene,camera,paused:false,portrait(){const oldSize=renderer.getSize(new THREE.Vector2()),ratio=renderer.getPixelRatio(),pos=camera.position.clone(),aspect=camera.aspect;const temp=new THREE.AnimationMixer(model);motion.dispose();temp.clipAction(clips.find(c=>c.name==='Idle')).play();temp.update(.35);floor.visible=false;renderer.setPixelRatio(1);renderer.setSize(256,256,false);camera.aspect=1;camera.position.set(1.9,1.9,3.2);camera.lookAt(0,1.1,0);camera.updateProjectionMatrix();renderer.render(scene,camera);const url=renderer.domElement.toDataURL('image/png');temp.stopAllAction();temp.uncacheRoot(model);floor.visible=true;renderer.setPixelRatio(ratio);renderer.setSize(oldSize.x,oldSize.y,false);camera.position.copy(pos);camera.aspect=aspect;camera.updateProjectionMatrix();motion=createKayKitMotion(THREE,model,clips,window.review.def);window.review.motion=motion;return url;}};
let last=performance.now();function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000);last=now;if(!window.review.paused){time+=dt;entity.moveAmt=mode==='run'||mode==='runAttack'?1:0;entity.z+=entity.moveAmt*6*dt;entity.alive=mode!=='death';entity.dashT=mode==='dash'&&time%1.5<.22?.2:0;entity.attackAnim=Math.max(0,entity.attackAnim-dt*4);if((mode==='attack'||mode==='runAttack')&&Math.floor(time/.9)!==lastHit){lastHit=Math.floor(time/.9);entity.lastAttack=time;entity.attackAnim=1;}motion?.update(entity,dt);}controls.update();renderer.render(scene,camera)}requestAnimationFrame(frame);setMode('idle');choose('bolt').catch(fail);
</script></html>
