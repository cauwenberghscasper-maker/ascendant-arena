<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ascendant Arena — audit asset gallery</title>
<style>body{background:#151923;color:#eef2ff;font:15px system-ui;margin:20px}h1{font-size:24px}nav{position:sticky;top:0;background:#151923;padding:12px;display:flex;gap:10px}button{background:#29374f;color:white;border:1px solid #758aa4;padding:12px;cursor:pointer}#grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}article{background:#202938;padding:10px;border-radius:10px}canvas{width:100%;aspect-ratio:1;display:block}small{display:block;color:#bfcade}#status{min-height:24px}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"}}</script>
<h1>Original assets: neutral-light review</h1><p>Read-only gallery. No replacement assets. Static meshes normalized for comparison; in-game animation, scale, effects and lighting differ.</p><nav><button data-kind="hero">16 heroes</button><button data-kind="enemy">14 enemies</button><button data-kind="weapon">10 weapons</button><button data-kind="gear">1 gear model</button></nav><p id="status">Loading inventory…</p><main id="grid"></main>
<script type="module">
import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const evidence=await fetch('./evidence.json').then(r=>r.json()),grid=document.querySelector('#grid'),status=document.querySelector('#status');
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(320,320);renderer.setPixelRatio(1);renderer.toneMapping=THREE.NeutralToneMapping;
const scene=new THREE.Scene();scene.background=new THREE.Color('#202938');scene.add(new THREE.HemisphereLight(0xffffff,0x64718b,2));const sun=new THREE.DirectionalLight(0xfff5e3,3);sun.position.set(3,5,4);scene.add(sun);const rim=new THREE.DirectionalLight(0xa9caff,2);rim.position.set(-4,2,-3);scene.add(rim);
const camera=new THREE.PerspectiveCamera(35,1,.01,100),loader=new GLTFLoader();let active=false;
async function show(kind){if(active)return;active=true;grid.replaceChildren();let ok=0;const assets=evidence.assets.filter(a=>a.path.split('/')[1]===kind);status.textContent=`Loading ${kind}…`;
for(const a of assets){const article=document.createElement('article'),label=document.createElement('strong'),canvas=document.createElement('canvas'),details=document.createElement('small');canvas.width=320;canvas.height=320;label.textContent=a.path.replace('assets/','').replace('/model.json','').replace('/',' · ');details.textContent=`${a.triangles.toLocaleString()} triangles · ${a.animations} clips · ${a.skins} skins`;article.append(canvas,label,details);grid.append(article);
try{const url=new URL('../'+a.path,location.href),pack=await fetch(url).then(r=>r.json()),bytes=Uint8Array.from(atob(pack.glb),c=>c.charCodeAt(0));const gltf=await loader.parseAsync(bytes.buffer,new URL('./',url).href);const model=gltf.scene,box=new THREE.Box3().setFromObject(model),size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3());model.position.sub(center);const scale=2/Math.max(size.x,size.y,size.z);model.scale.setScalar(scale);model.position.multiplyScalar(scale);scene.add(model);camera.position.set(2.2,1.3,4.2);camera.lookAt(0,0,0);renderer.render(scene,camera);canvas.getContext('2d').drawImage(renderer.domElement,0,0);scene.remove(model);model.traverse(o=>{if(o.isMesh){o.geometry.dispose();for(const m of (Array.isArray(o.material)?o.material:[o.material])){for(const v of Object.values(m))if(v?.isTexture)v.dispose();m.dispose();}}});ok++;}catch(e){details.textContent+=' · ERROR: '+e.message;}status.textContent=`${kind}: ${ok}/${assets.length} rendered`;}
active=false;}
document.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>show(b.dataset.kind)));await show('hero');
</script>
